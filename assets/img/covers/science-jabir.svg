  <circle cx="130" cy="420" r="140" fill="#fbbf24" fill-opacity="0.08"/>

  <!-- Bespoke Subject Illustration -->
  
    <!-- Chemistry Flask + Manuscript Scroll -->
    <path d="M235 120 L275 120 L275 180 L330 295 A16 16 0 0 1 315 316 L195 316 A16 16 0 0 1 180 295 L235 180 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
