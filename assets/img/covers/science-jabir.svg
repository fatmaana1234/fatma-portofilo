    <line x1="448" y1="215" x2="612" y2="215" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    <line x1="448" y1="250" x2="575" y2="250" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    

  <!-- Top Left Domain Badge -->
  <rect x="44" y="36" rx="10" ry="10" width="186" height="36" fill="#0f172a" fill-opacity="0.65" stroke="#fbbf24" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="64" y="60" font-family="Inter, Cairo, sans-serif" font-size="14" font-weight="700" fill="#fbbf24" letter-spacing="0.8">CHEMISTRY STORY</text>

