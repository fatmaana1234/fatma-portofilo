<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1433"/>
      <stop offset="100%" stop-color="#2b2052"/>
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="670" cy="110" r="170" fill="#a855f7" fill-opacity="0.12"/>
  <circle cx="130" cy="420" r="140" fill="#a855f7" fill-opacity="0.08"/>

  <!-- Bespoke Subject Illustration -->
  
    <rect x="130" y="140" width="120" height="145" rx="18" fill="#3b0764" stroke="#c084fc" stroke-width="2.5"/>
    <text x="190" y="232" text-anchor="middle" font-family="Inter, sans-serif" font-size="72" font-weight="800" fill="#e9d5ff">+</text>
    <rect x="270" y="140" width="120" height="145" rx="18" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2.5"/>
    <text x="330" y="232" text-anchor="middle" font-family="Inter, sans-serif" font-size="72" font-weight="800" fill="#bfdbfe">−</text>
    <rect x="410" y="140" width="120" height="145" rx="18" fill="#065f46" stroke="#34d399" stroke-width="2.5"/>
    <text x="470" y="232" text-anchor="middle" font-family="Inter, sans-serif" font-size="72" font-weight="800" fill="#a7f3d0">×</text>
    <rect x="550" y="140" width="120" height="145" rx="18" fill="#7c2d12" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="610" y="232" text-anchor="middle" font-family="Inter, sans-serif" font-size="72" font-weight="800" fill="#fde68a">÷</text>
    

  <!-- Top Left Domain Badge -->
  <rect x="44" y="36" rx="10" ry="10" width="256" height="36" fill="#0f172a" fill-opacity="0.65" stroke="#a855f7" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="64" y="60" font-family="Inter, Cairo, sans-serif" font-size="14" font-weight="700" fill="#a855f7" letter-spacing="0.8">ARITHMETIC FOUNDATIONS</text>

  <!-- Bottom Informative Title Strip -->
  <rect x="44" y="378" width="712" height="86" rx="16" fill="#090d1a" fill-opacity="0.78" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.2"/>
  <rect x="44" y="378" width="6" height="86" rx="3" fill="#a855f7"/>
  <text x="734" y="416" text-anchor="end" font-family="Cairo, Inter, sans-serif" font-size="25" font-weight="800" fill="#ffffff">أساسيات الرياضيات والعمليات الحسابية</text>
  <text x="734" y="446" text-anchor="end" font-family="Inter, Cairo, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">Simplifying Addition, Subtraction, Multiplication &amp; Division</text>
</svg>