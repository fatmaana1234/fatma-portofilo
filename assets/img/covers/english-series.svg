  <!-- Top Left Domain Badge -->
  <rect x="44" y="36" rx="10" ry="10" width="196" height="36" fill="#0f172a" fill-opacity="0.65" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1.5"/>
